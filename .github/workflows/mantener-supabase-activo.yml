name: Mantener Supabase activo

# Supabase pausa los proyectos gratuitos tras una semana sin actividad.
# Este aviso consulta la base de datos cada dos días para que no se pause.
# La URL y la clave son las públicas de la web (ya viajan en el JavaScript).
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://zoopdygqskchmoppabiq.supabase.co/rest/v1/closures?select=id&limit=1" \
            -H "apikey: sb_publishable_JN_kxHd_sRmIKUzhuFPwzg_UDq-mLnY"
