name: Mantener Supabase activo

# QUÉ HACE ESTE ARCHIVO
#
# 1) Supabase pausa los proyectos gratuitos tras una semana sin actividad. Cada dos días,
#    esta tarea consulta la base de datos para que no se pause. La URL y la clave son las
#    públicas de la web (ya viajan en el JavaScript).
#
# 2) GitHub desactiva las tareas programadas de un repositorio público si pasan 60 días sin
#    actividad. Para que eso no ocurra, los lunes (o cuando se lanza a mano) esta tarea
#    llama a la API de GitHub y vuelve a activar cada tarea programada del repositorio.
#    No hace commits ni cambios en el código: solo esa llamada.
#
#    Después de activar cada tarea, comprueba que su estado es «active» y lo escribe en el
#    registro («✔ archivo.yml: activa»). Si alguna no queda activa, la ejecución falla y
#    GitHub lo avisa.
#
# SI SE AÑADE OTRA TAREA PROGRAMADA (con "schedule" y "cron") a este repositorio, hay que
# añadir su archivo a la lista TAREAS del último paso.
#
# Por qué hay dos horarios: el primero (días impares del mes) no coincide siempre con un
# lunes; el segundo asegura una ejecución cada lunes.
on:
  schedule:
    - cron: "17 6 */2 * *"
    - cron: "47 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Consultar la base de datos
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://zoopdygqskchmoppabiq.supabase.co/rest/v1/closures?select=id&limit=1" \
            -H "apikey: sb_publishable_JN_kxHd_sRmIKUzhuFPwzg_UDq-mLnY"

      - name: Reactivar las tareas programadas (lunes o a mano)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Hoy no es lunes: no hace falta reactivar nada."
            exit 0
          fi

          # Archivos de .github/workflows/ que tienen "schedule" (cron).
          TAREAS="mantener-supabase-activo.yml"

          fallo=0
          for archivo in $TAREAS; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$archivo/enable"
            estado=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$archivo" --jq '.state')
            if [ "$estado" = "active" ]; then
              echo "✔ $archivo: activa"
            else
              echo "✘ $archivo: estado «$estado» (debería ser «active»)"
              fallo=1
            fi
          done
          exit $fallo
