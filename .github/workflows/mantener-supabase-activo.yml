name: Mantener Supabase activo

# Supabase pausa los proyectos gratuitos tras una semana sin actividad.
# Este aviso consulta la base de datos cada dos días para que no se pause.
# La URL y la clave son las públicas de la web (ya viajan en el JavaScript).
#
# GitHub desactiva los avisos programados de un repositorio público si pasan
# 60 días sin actividad (commits, PR, etc.), y con ellos dejaría de llegar el
# aviso a Supabase. Por eso, en cada ejecución, el propio aviso se vuelve a
# activar a sí mismo, lo que reinicia ese plazo de 60 días. Además, el día 1 de
# cada mes (o al lanzarlo a mano) sube un pequeño registro a la rama "latido",
# para que el repositorio siempre tenga actividad reciente. Esa rama no afecta
# a la web publicada.
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Consultar la base de datos
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://zoopdygqskchmoppabiq.supabase.co/rest/v1/closures?select=id&limit=1" \
            -H "apikey: sb_publishable_JN_kxHd_sRmIKUzhuFPwzg_UDq-mLnY"

      - name: Mantener activo este aviso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/mantener-supabase-activo.yml/enable"

      - name: Subir registro de actividad a la rama latido
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%d)" != "01" ]; then
            echo "Hoy no toca registro mensual."
            exit 0
          fi
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin latido >/dev/null 2>&1; then
            git fetch --quiet origin latido
            git checkout --quiet -B latido origin/latido
          else
            git checkout --quiet --orphan latido
            git rm -rfq . || true
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > latido.txt
          git add latido.txt
          git commit --quiet -m "Registro de actividad mensual"
          git push --quiet origin latido
